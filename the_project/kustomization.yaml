apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
resources:
  - manifests/configmap.yaml
  # secret.yaml is intentionally NOT listed here — it's git-ignored (contains
  # credentials). CI creates the `project-secret` Secret imperatively via
  # `kubectl create secret --from-literal=...` before running `kustomize build`.
  - manifests/statefulset.yaml
  - manifests/service.yaml
  - manifests/ingress.yaml
  - manifests/deployment.yaml
  - manifests/cronjob.yaml
images:
  - name: PROJECT/BACKEND
    newName: nickleezx/the_project
    newTag: "0.0.11"
  - name: PROJECT/FRONTEND
    newName: nickleezx/the_project_fe
    newTag: "0.0.6"
  - name: PROJECT/CRONJOB
    newName: nickleezx/the_project_cron
    newTag: "0.0.1"