apiVersion: v1
kind: ConfigMap
metadata:
  name: project-configmap
data:
  BACKEND_URL: http://localhost:8081/api
  KUBERNETES_BACKEND: http://the-project-svc:1234/api/todo
  POSTGRES_PORT: "5432"
  POSTGRES_HOST: postgres-stset-0.postgres-svc
  # Change this to the name of your Google Cloud Storage bucket
  GCS_BUCKET: "gs://nickleezx-dwk-project-todo-backup"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
data:
  backup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "Installing postgresql-client-18 from the PostgreSQL apt repo..."
    apt-get update -qq
    apt-get install -y -qq curl ca-certificates gnupg lsb-release >/dev/null
    install -d /usr/share/postgresql-common/pgdg
    curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
      -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
      > /etc/apt/sources.list.d/pgdg.list
    apt-get update -qq
    apt-get install -y -qq postgresql-client-18 >/dev/null

    echo "Authenticating to Google Cloud..."
    gcloud auth activate-service-account --key-file="${GOOGLE_APPLICATION_CREDENTIALS}"

    TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
    BACKUP_FILE="/tmp/todo-backup-${TIMESTAMP}.sql"

    echo "Dumping database ${POSTGRES_DB} from ${POSTGRES_HOST}..."
    PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
      -h "${POSTGRES_HOST}" \
      -p "${POSTGRES_PORT}" \
      -U "${POSTGRES_USER}" \
      -d "${POSTGRES_DB}" \
      -F c \
      -f "${BACKUP_FILE}"

    echo "Uploading to ${GCS_BUCKET}..."
    gsutil cp "${BACKUP_FILE}" "${GCS_BUCKET}/todo-backup-${TIMESTAMP}.sql"

    echo "Backup completed: ${GCS_BUCKET}/todo-backup-${TIMESTAMP}.sql"
